<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="420" viewBox="0 0 1320 420">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      .box { fill: #f8fafc; stroke: #334155; stroke-width: 2; rx: 8; }
      .shader { fill: #eef2ff; stroke: #4338ca; stroke-width: 2; rx: 8; }
      .test { fill: #fff7ed; stroke: #c2410c; stroke-width: 2; rx: 8; }
      .out { fill: #f0fdf4; stroke: #15803d; stroke-width: 2; rx: 8; }
      .layout { fill: #fdf2f8; stroke: #be185d; stroke-width: 2; rx: 8; }
      .text { font-family: Arial, sans-serif; font-size: 15px; fill: #0f172a; text-anchor: middle; dominant-baseline: middle; }
      .title { font-family: Arial, sans-serif; font-size: 26px; font-weight: 700; fill: #0f172a; text-anchor: middle; dominant-baseline: middle; }
      .small { font-family: Arial, sans-serif; font-size: 13px; fill: #475569; text-anchor: middle; dominant-baseline: middle; }
      .arrow { stroke: #334155; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #be185d; stroke-width: 2; fill: none; stroke-dasharray: 8 6; marker-end: url(#arrow); }
    </style>
  </defs>

  <text x="660" y="34" class="title">Vulkan Graphics Pipeline Stages</text>

  <rect x="30" y="92" width="110" height="64" class="box"/>
